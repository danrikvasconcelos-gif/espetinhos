<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Espetinho da Brasa – Peça pelo WhatsApp</title>
<meta name="description" content="Espetinhos na brasa. Monte seu pedido e envie pelo WhatsApp.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍢</text></svg>">
<style>
:root{--carvao:#1c1917;--brasa:#e4572e;--brasa-esc:#b8401c;--cinza:#57534e;--areia:#f5f0e8;--branco:#fff;--verde:#1f7a4d}
*{box-sizing:border-box;margin:0}
body{font-family:Georgia,"Times New Roman",serif;background:var(--areia);color:var(--carvao);line-height:1.5;padding-bottom:88px}
header{background:var(--carvao);color:var(--areia);padding:40px 20px 32px;text-align:center}
h1{font-size:clamp(2rem,8vw,3.4rem);line-height:1.05;letter-spacing:-.02em}
header p{margin-top:10px;color:#d6cfc4;max-width:34ch;margin-inline:auto}
main{max-width:720px;margin:0 auto;padding:20px}
h2{font-size:1.3rem;margin:26px 0 10px}
.item{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--branco);border-left:5px solid var(--brasa);padding:12px 14px;margin-bottom:10px;border-radius:4px}
.item strong{display:block}
.item small{color:var(--cinza)}
.preco{font-weight:bold;white-space:nowrap}
.qtd{display:flex;align-items:center;gap:8px}
button{font:inherit;cursor:pointer}
.qtd button{width:36px;height:36px;border-radius:50%;border:2px solid var(--brasa);background:var(--branco);color:var(--brasa);font-size:1.2rem;font-weight:bold}
.qtd button:active{background:var(--brasa);color:var(--branco)}
.qtd span{min-width:20px;text-align:center}
:focus-visible{outline:3px solid var(--carvao);outline-offset:2px}
#barra{position:fixed;left:0;right:0;bottom:0;background:var(--brasa);color:var(--branco);padding:14px 20px;display:flex;justify-content:space-between;align-items:center;border:0;width:100%;font-size:1.05rem;font-weight:bold}
#barra:disabled{background:#a8a29e}
dialog{border:0;border-radius:8px;padding:22px;width:min(92vw,460px);max-height:90vh}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog h3{margin-bottom:12px}
.linha{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed #d6d3d1}
label{display:block;margin-top:12px;font-weight:bold;font-size:.95rem}
input,select,textarea{width:100%;font:inherit;padding:10px;border:1px solid #a8a29e;border-radius:4px;margin-top:4px}
.total{font-size:1.2rem;font-weight:bold;margin-top:14px;text-align:right}
.acoes{display:flex;gap:10px;margin-top:16px}
.acoes button{flex:1;padding:12px;border-radius:4px;border:0;font-weight:bold}
.zap{background:var(--verde);color:var(--branco)}
.fechar{background:#e7e5e4}
.erro{color:#b91c1c;font-size:.9rem;margin-top:8px;min-height:1.2em}
@media (prefers-reduced-motion:no-preference){.qtd button{transition:background .15s,color .15s}}
</style>
</head>
<body>
<header>
  <h1>Espetinho da Brasa</h1>
  <p>Assado na hora. Escolha os espetos e envie o pedido pelo WhatsApp.</p>
</header>
<main id="cardapio"></main>

<button id="barra" disabled><span id="barra-qtd">Enviar pedido</span><span id="barra-total">R$ 0,00</span></button>

<dialog id="dlg">
  <h3>Seu pedido</h3>
  <div id="resumo"></div>
  <div class="total" id="total"></div>
  <label for="nome">Seu nome</label>
  <input id="nome" autocomplete="name">
  <label for="tipo">Como quer receber?</label>
  <select id="tipo"><option>Retirada no local</option><option>Entrega</option></select>
  <div id="campo-end" hidden>
    <label for="end">Endereço de entrega</label>
    <input id="end" autocomplete="street-address">
  </div>
  <label for="pgto">Pagamento</label>
  <select id="pgto"><option>Pix</option><option>Dinheiro</option><option>Cartão</option></select>
  <label for="obs">Observações (ponto da carne, sem farofa...)</label>
  <textarea id="obs" rows="2"></textarea>
  <p class="erro" id="erro" role="alert"></p>
  <div class="acoes">
    <button class="fechar" id="fechar">Voltar</button>
    <button class="zap" id="enviar">Enviar no WhatsApp</button>
  </div>
</dialog>

<script>
// ====== CONFIGURE AQUI ======
const WHATSAPP = "5588999999999"; // DDI + DDD + número, só dígitos
const TAXA_ENTREGA = 5;           // 0 para não cobrar
let MENU=[],EST={};
const api=async b=>{const r=await fetch("/api",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)});const j=await r.json();if(!r.ok)throw new Error(j.erro||"Erro");return j};
async function carregar(){try{const d=await api({a:"menu"});MENU=d.menu;EST=d.estoque}catch(e){$("cardapio").innerHTML="<p>Cardápio indisponível. Tente novamente em instantes.</p>";return}desenhar();atualizar()}
// ============================

const brl = v => v.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const carrinho = {};
const $ = id => document.getElementById(id);

function desenhar(){
  const cats=[...new Set(MENU.map(i=>i.cat))];
  $("cardapio").innerHTML = cats.map(c => `<h2>${c}</h2>` + MENU.filter(i=>i.cat===c).map(i => { const e=+EST[i.id]||0; return `
    <div class="item">
      <div><strong>${i.nome}</strong><small>${i.desc}</small><div class="preco">${brl(i.preco)}${e>0?"":" · Esgotado"}</div></div>
      ${e>0?`<div class="qtd">
        <button aria-label="Remover ${i.nome}" data-id="${i.id}" data-d="-1">−</button>
        <span id="q${i.id}">0</span>
        <button aria-label="Adicionar ${i.nome}" data-id="${i.id}" data-d="1">+</button>
      </div>`:""}
    </div>`}).join("")).join("");
}
function subtotal(){return MENU.reduce((s,i)=>s+(carrinho[i.id]||0)*i.preco,0)}
function qtdTotal(){return Object.values(carrinho).reduce((a,b)=>a+b,0)}
function atualizar(){
  MENU.forEach(i=>{const q=$("q"+i.id);if(q)q.textContent=carrinho[i.id]||0});
  const n = qtdTotal();
  $("barra").disabled = n===0;
  $("barra-qtd").textContent = n ? `Enviar pedido (${n} ${n>1?"itens":"item"})` : "Enviar pedido";
  $("barra-total").textContent = brl(subtotal());
}
function total(){return subtotal() + ($("tipo").value==="Entrega"?TAXA_ENTREGA:0)}
function resumo(){
  $("resumo").innerHTML = MENU.filter(i=>carrinho[i.id]).map(i =>
    `<div class="linha"><span>${carrinho[i.id]}× ${i.nome}</span><span>${brl(carrinho[i.id]*i.preco)}</span></div>`).join("")
    + ($("tipo").value==="Entrega" && TAXA_ENTREGA ? `<div class="linha"><span>Taxa de entrega</span><span>${brl(TAXA_ENTREGA)}</span></div>`:"");
  $("total").textContent = "Total: " + brl(total());
}

$("cardapio").addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b) return;
  const id = +b.dataset.id, d = +b.dataset.d;
  carrinho[id] = Math.min(+EST[id]||0,Math.max(0,(carrinho[id]||0)+d));
  atualizar();
});
$("barra").onclick = () => { resumo(); $("erro").textContent=""; $("dlg").showModal(); };
$("fechar").onclick = () => $("dlg").close();
$("tipo").onchange = () => { $("campo-end").hidden = $("tipo").value!=="Entrega"; resumo(); };
$("enviar").onclick = async () => {
  const nome=$("nome").value.trim(), ent=$("tipo").value==="Entrega", end=$("end").value.trim();
  if(!nome){ $("erro").textContent="Informe seu nome."; return; }
  if(ent && !end){ $("erro").textContent="Informe o endereço de entrega."; return; }
  $("enviar").disabled=true; $("erro").textContent="";
  try{
    const r=await api({a:"pedido",nome,tipo:$("tipo").value,end,pgto:$("pgto").value,obs:$("obs").value.trim(),taxa:TAXA_ENTREGA,itens:carrinho});
    let m=`*Pedido #${r.id} – Espetinho da Brasa*\nCliente: ${nome}\n\n`;
    MENU.filter(i=>carrinho[i.id]).forEach(i => m += `${carrinho[i.id]}x ${i.nome} – ${brl(carrinho[i.id]*i.preco)}\n`);
    m += `\n${ent?`Entrega: ${end}\nTaxa: ${brl(TAXA_ENTREGA)}`:"Retirada no local"}\nPagamento: ${$("pgto").value}`;
    if($("obs").value.trim()) m += `\nObs: ${$("obs").value.trim()}`;
    m += `\n*Total: ${brl(r.subtotal+(ent?TAXA_ENTREGA:0))}*`;
    Object.keys(carrinho).forEach(k=>delete carrinho[k]);
    $("dlg").close(); carregar();
    location.href=`https://wa.me/${WHATSAPP}?text=${encodeURIComponent(m)}`;
  }catch(e){ $("erro").textContent=e.message; carregar(); }
  $("enviar").disabled=false;
};

carregar();
</script>
</body>
</html>
