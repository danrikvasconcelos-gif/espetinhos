<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Painel – Espetinho da Brasa</title><link rel="icon" type="image/svg+xml" href="/logo.svg">
<style>
:root{--c:#1c1917;--b:#e4572e;--v:#1f7a4d;--r:#b91c1c;--a:#f5f0e8}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
body{font-family:system-ui,sans-serif;background:var(--a);color:var(--c);padding-bottom:40px}
#login{max-width:340px;margin:18vh auto;padding:20px;display:grid;gap:10px;text-align:center}
nav{position:sticky;top:0;background:var(--c);display:flex;overflow-x:auto;z-index:2}
nav button{flex:1;min-width:88px;padding:14px 8px;background:none;border-radius:0;color:#d6cfc4}
nav button.on{color:#fff;border-bottom:3px solid var(--b);font-weight:bold}
main{max-width:900px;margin:0 auto;padding:14px}
.card{background:#fff;border-left:5px solid var(--b);border-radius:4px;padding:12px;margin-bottom:12px}
h3{margin-bottom:6px}
.row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.row input{flex:1 1 130px}.row input[type=number]{flex:0 0 90px}
.ln{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px dashed #d6d3d1;gap:8px}
.tot{text-align:right;font-weight:bold;font-size:1.15rem;margin-top:8px}
input,select{font:inherit;padding:9px;border:1px solid #a8a29e;border-radius:4px;min-width:0}
button{font:inherit;padding:9px 14px;border:0;border-radius:4px;background:var(--c);color:#fff;cursor:pointer}
button.ok{background:var(--v)}button.no{background:var(--r)}
#sair{flex:0 0 auto;background:var(--r);color:#fff;margin:6px;padding:8px 12px;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{background:#e7e5e4;color:var(--c)}.chip:disabled{opacity:.4}
small{color:#57534e}
</style></head><body>
<div id="login"><img src="/logo.svg" width="88" height="88" alt="Logo Espetinho da Brasa" style="justify-self:center;border-radius:18px"><h1>Painel do dono</h1><input id="usuario" placeholder="Usuário" autocomplete="username" autocapitalize="none" value="admin"><input id="senha" type="password" placeholder="Senha" autocomplete="current-password"><button id="entrar">Entrar</button><p id="lerr" style="color:var(--r)"></p></div>
<div id="app" hidden>
<nav id="abas"><img src="/logo.svg" alt="" width="34" height="34" style="flex:none;margin:5px 8px;border-radius:8px"><button data-t="mesas">Mesas</button><button data-t="wpp">WhatsApp</button><button data-t="estoque">Estoque</button><button data-t="ajustes">Ajustes</button><button data-t="usuarios">Usuários</button><button data-t="rel">Relatório</button><button id="sair">Sair</button></nav>
<main id="v"></main></div>
<script>
const PG=['Pix','Dinheiro','Cartão'],pgo=s=>PG.map(p=>`<option${p===s?' selected':''}>${p}</option>`).join('');
const TZ={timeZone:'America/Fortaleza'};
const $=id=>document.getElementById(id),brl=v=>(+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S={},aba='mesas',tok=sessionStorage.tok||'',dia=new Date().toLocaleDateString('sv-SE',TZ),D=[],ab={};
const P=id=>S.menu.find(p=>p.id==id)||{nome:'?',preco:0};
const tot=it=>Object.entries(it).reduce((s,[i,q])=>s+q*P(i).preco,0);
const api=async b=>{const r=await fetch('/api',{method:'POST',headers:{'Content-Type':'application/json','x-token':tok},body:JSON.stringify(b)});const j=await r.json();if(!r.ok){if(r.status===401&&tok)limpar();throw new Error(j.erro||'Erro')}return j};
function limpar(){tok='';sessionStorage.clear();$('app').hidden=true;$('login').hidden=false}
async function load(){S=await api({a:'state',dia});render()}
async function act(b){try{await api(b);await load();return true}catch(e){alert(e.message);return false}}
async function entrar(){
 $('lerr').textContent='';
 try{
  if(!tok){const r=await fetch('/api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({a:'login',usuario:$('usuario').value,senha:$('senha').value})});const j=await r.json();if(!r.ok)throw new Error(j.erro||'Erro');tok=j.token;sessionStorage.tok=tok}
  await load();$('login').hidden=true;$('app').hidden=false;$('senha').value='';
 }catch(e){tok='';sessionStorage.clear();$('lerr').textContent=e.message;$('app').hidden=true;$('login').hidden=false}
}
$('entrar').onclick=entrar;$('senha').onkeydown=e=>{if(e.key==='Enter')entrar()};$('usuario').onkeydown=$('senha').onkeydown;$('sair').onclick=async()=>{try{await api({a:'logout'})}catch(e){}limpar()};if(tok)entrar();
function go(t){aba=t;if(t==='ajustes')D=JSON.parse(JSON.stringify(S.menu));render()}
$('abas').onclick=e=>{if(e.target.dataset.t)go(e.target.dataset.t)};
setInterval(()=>{if((aba==='mesas'||aba==='wpp')&&tok&&!document.activeElement.matches('input,select'))load().catch(()=>{})},15000);
function render(){
 const n=Object.keys(S.pedidos).length,ro=S.perfil!=='admin';
 if(ro&&(aba==='ajustes'||aba==='usuarios'))aba='mesas';
 document.querySelectorAll('nav button[data-t]').forEach(b=>{const t=b.dataset.t;b.hidden=ro&&(t==='ajustes'||t==='usuarios');b.classList.toggle('on',t===aba);if(t==='wpp')b.textContent='WhatsApp'+(n?` (${n})`:'')});
 $('sair').textContent='Sair ('+S.usuario+')';
 $('v').innerHTML=({mesas:vMesas,wpp:vWpp,estoque:vEstoque,ajustes:vAjustes,rel:vRel,usuarios:vUsuarios})[aba]();
 if(ro){document.querySelectorAll('#v .w').forEach(e=>e.remove());document.querySelectorAll('.est').forEach(e=>e.disabled=true);$('v').insertAdjacentHTML('afterbegin','<p style="margin-bottom:10px"><small>Perfil de visualização: somente consulta.</small></p>')}
}
// ---------- MESAS ----------
const abrir=()=>{const m=parseInt($('nm').value);if(!m||!$('gm').value)return alert('Informe o nº da mesa e o garçom');act({a:'mesa_abrir',mesa:String(m),garcom:$('gm').value})};
const item=(m,id,d)=>act({a:'mesa_item',mesa:m,id,d});
const fecharMesa=n=>{if(confirm('Fechar a mesa '+n+'?'))act({a:'mesa_fechar',mesa:n,pgto:$('pg'+n).value})};
function vMesas(){
 return `<div class="card w"><h3>Abrir mesa</h3><div class="row"><input id="nm" type="number" min="1" placeholder="Nº da mesa"><select id="gm">${[...new Set([...S.garcons,...(S.gu||[])])].map(g=>`<option>${esc(g)}</option>`).join('')}</select><button onclick="abrir()">Abrir</button></div>${(S.garcons.length+(S.gu||[]).length)?'':'<small>Cadastre os garçons na aba Ajustes.</small>'}</div>`
 +Object.entries(S.mesas).sort((a,b)=>a[0]-b[0]).map(([n,t])=>`<div class="card"><h3>Mesa ${n} · ${esc(t.garcom)}</h3>
 ${Object.entries(t.itens).map(([id,q])=>`<div class="ln"><span>${q}× ${esc(P(id).nome)}</span><span>${brl(q*P(id).preco)} <button class="w" onclick="item('${n}',${id},-1)">−</button></span></div>`).join('')||'<small>Sem itens</small>'}
 <details class="w" ${ab[n]?'open':''} ontoggle="ab['${n}']=this.open"><summary style="margin-top:8px;cursor:pointer">Adicionar item</summary><div class="chips">${S.menu.map(p=>`<button class="chip" ${+S.estoque[p.id]>0?'':'disabled'} onclick="item('${n}',${p.id},1)">${esc(p.nome)} <small>(${+S.estoque[p.id]||0})</small></button>`).join('')}</div></details>
 <div class="tot">Total: ${brl(tot(t.itens))}</div>
 <div class="row w"><select id="pg${n}">${pgo()}</select><button class="ok" onclick="fecharMesa('${n}')">Fechar mesa</button></div></div>`).join('')
 ||'<p style="text-align:center;color:#57534e">Nenhuma mesa aberta.</p>';
}
// ---------- WHATSAPP ----------
const fecharW=id=>act({a:'wpp_fechar',id,pgto:$('wp'+id).value});
const cancelarW=id=>{if(confirm('Cancelar o pedido #'+id+'? O estoque será devolvido.'))act({a:'wpp_cancelar',id})};
function vWpp(){
 return Object.values(S.pedidos).sort((a,b)=>a.id-b.id).map(o=>`<div class="card"><h3>#${o.id} · ${esc(o.cliente)} <small>${o.ts}</small></h3>
 <div>${o.tipo}${o.tipo==='Entrega'?': '+esc(o.end):''}</div>
 ${Object.entries(o.itens).map(([id,q])=>`<div class="ln"><span>${q}× ${esc(P(id).nome)}</span><span>${brl(q*P(id).preco)}</span></div>`).join('')}
 ${o.taxa?`<div class="ln"><span>Taxa de entrega</span><span>${brl(o.taxa)}</span></div>`:''}${o.obs?`<div><small>Obs: ${esc(o.obs)}</small></div>`:''}
 <div class="tot">Total: ${brl(tot(o.itens)+o.taxa)}</div>
 <div class="row w"><select id="wp${o.id}">${pgo(o.pgto)}</select><button class="ok" onclick="fecharW(${o.id})">Fechar (pago)</button><button class="no" onclick="cancelarW(${o.id})">Cancelar</button></div></div>`).join('')
 ||'<p style="text-align:center;color:#57534e">Nenhum pedido pendente do WhatsApp.</p>';
}
// ---------- ESTOQUE ----------
const vEstoque=()=>`<div class="card"><h3>Estoque</h3><small>Digite as quantidades disponíveis e clique em Salvar estoque. Os clientes e as mesas usam este mesmo estoque.</small>`
 +S.menu.map(p=>`<div class="ln"><span>${esc(p.nome)}</span><input class="est" type="number" min="0" data-id="${p.id}" data-orig="${+S.estoque[p.id]||0}" value="${+S.estoque[p.id]||0}"></div>`).join('')
 +`<div class="row w"><button class="ok" onclick="salvarEstoque()">Salvar estoque</button></div></div>`;
async function salvarEstoque(){
 const itens={};document.querySelectorAll('.est').forEach(i=>{if(i.value!==i.dataset.orig)itens[i.dataset.id]=i.value});
 if(!Object.keys(itens).length)return alert('Nenhuma quantidade foi alterada.');
 if(await act({a:'estoque_lote',itens}))alert('Estoque salvo!');
}
// ---------- AJUSTES ----------
const addP=()=>{D.push({id:Math.max(0,...D.map(p=>p.id))+1,cat:'Carnes',nome:'',desc:'',preco:0});render()};
function vAjustes(){
 return `<div class="card"><h3>Garçons</h3><small>Separe os nomes por vírgula.</small><div class="row"><input id="gl" value="${esc(S.garcons.join(', '))}"><button onclick="act({a:'garcons',lista:$('gl').value.split(',').map(s=>s.trim()).filter(Boolean)})">Salvar</button></div></div>
 <div class="card"><h3>Cardápio</h3>${D.map((p,i)=>`<div class="row"><input placeholder="Categoria" value="${esc(p.cat)}" oninput="D[${i}].cat=this.value"><input placeholder="Nome" value="${esc(p.nome)}" oninput="D[${i}].nome=this.value"><input placeholder="Descrição" value="${esc(p.desc)}" oninput="D[${i}].desc=this.value"><input type="number" step="0.5" min="0" value="${p.preco}" oninput="D[${i}].preco=+this.value"><button class="no" onclick="D.splice(${i},1);render()">✕</button></div>`).join('')}
 <div class="row"><button onclick="addP()">+ Novo item</button><button class="ok" onclick="act({a:'menu_save',menu:D.filter(p=>p.nome.trim())})">Salvar cardápio</button></div></div>`;
}
// ---------- USUÁRIOS ----------
const vUsuarios=()=>`<div class="card"><h3>Novo usuário</h3><small>Visualização: só consulta (mesas, pedidos, estoque e relatório). Garçom: usa a página /garcom para abrir mesas, lançar pedidos e fechar a conta das próprias mesas. Admin: altera tudo, inclusive usuários. Para trocar a senha ou o perfil, salve de novo com o mesmo usuário.</small>
 <div class="row"><input id="nu" placeholder="Usuário (minúsculas e números)" autocapitalize="none"><input id="ns" type="password" placeholder="Senha (mín. 8 caracteres)" autocomplete="new-password"><select id="np"><option value="garcom">Garçom (só mesas)</option><option value="visualizacao">Visualização</option><option value="admin">Admin</option></select><button class="ok" onclick="salvarUsuario()">Salvar</button></div></div>
 <div class="card"><h3>Usuários cadastrados</h3><div class="ln"><span><b>admin</b> <small>(principal, senha definida na Vercel)</small></span><span>Admin</span></div>
 ${(S.usuarios||[]).map(u=>`<div class="ln"><span>${esc(u.usuario)}</span><span>${u.perfil==='admin'?'Admin':u.perfil==='garcom'?'Garçom':'Visualização'} <button class="no" onclick="delUsuario('${esc(u.usuario)}')">Excluir</button></span></div>`).join('')}</div>`;
async function salvarUsuario(){
 const usuario=$('nu').value.trim().toLowerCase(),senha=$('ns').value;
 if(!/^[a-z0-9._-]{3,30}$/.test(usuario)||usuario==='admin')return alert('Usuário: 3 a 30 caracteres, só letras minúsculas, números, ponto, hífen ou _ (e não pode ser "admin").');
 if(senha.length<8)return alert('A senha precisa ter pelo menos 8 caracteres.');
 if(await act({a:'usuario_salvar',usuario,senha,perfil:$('np').value}))alert('Usuário salvo!');
}
const delUsuario=u=>{if(confirm('Excluir o usuário '+u+'?'))act({a:'usuario_excluir',usuario:u})};
// ---------- RELATÓRIO ----------
const gs=()=>[...new Set(S.vendas.filter(v=>v.garcom).map(v=>v.garcom))].sort();
function vRel(){
 const s=c=>S.vendas.filter(v=>v.canal===c).reduce((a,v)=>a+v.total,0);
 return `<div class="card"><h3>Relatório do dia</h3><input type="date" value="${dia}" onchange="dia=this.value;load()">
 <div class="ln"><span>Mesas</span><b>${brl(s('mesa'))}</b></div><div class="ln"><span>WhatsApp</span><b>${brl(s('whatsapp'))}</b></div>
 <div class="tot">Total: ${brl(s('mesa')+s('whatsapp'))}</div>
 <div class="row"><button class="ok" onclick="relatorio('mesa')">Relatório de Mesas</button><button class="ok" onclick="relatorio('whatsapp')">Relatório WhatsApp</button></div>
 <div class="row"><select id="rg"><option value="">Todos os garçons</option>${gs().map(g=>`<option>${esc(g)}</option>`).join('')}</select><button class="ok" onclick="relatorio('garcom',$('rg').value)">Relatório por garçom</button></div>
 <div class="row"><button onclick="relatorio('geral')">Relatório geral (tudo)</button></div>
 <small>Mesas abertas e pedidos pendentes só entram depois de fechados.</small></div>`;
}
function relatorio(tipo,gar){
 const tb=(h,r)=>`<table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${r.map(l=>`<tr>${l.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</table>`;
 const det=x=>`<div class="bx"><b>${x.canal==='mesa'?`Mesa ${esc(x.mesa)} · Garçom ${esc(x.garcom)}`:`Pedido #${x.pedido} · ${esc(x.cliente)} (${esc(x.tipo)})`}</b> <span>${x.hora} · ${esc(x.pgto)}</span>${tb(['Item','Qtd','Valor'],x.itens.map(i=>[esc(i.nome),i.qtd,brl(i.qtd*i.preco)]))}${x.taxa?`<div>Taxa de entrega: ${brl(x.taxa)}</div>`:''}<div class="t">Total: ${brl(x.total)}</div></div>`;
 const sec=(t,v,g)=>{
  const pg={},it={},gc={};
  v.forEach(x=>{pg[x.pgto]=(pg[x.pgto]||0)+x.total;if(x.garcom)gc[x.garcom]=(gc[x.garcom]||0)+x.total;x.itens.forEach(i=>{it[i.nome]=it[i.nome]||{q:0,t:0};it[i.nome].q+=i.qtd;it[i.nome].t+=i.qtd*i.preco})});
  const T=v.reduce((a,x)=>a+x.total,0);
  return `<h2>${t}</h2><p><b>${v.length}</b> fechamentos · Total <b>${brl(T)}</b></p>`+(v.length?
   `<h3>Por forma de pagamento</h3>`+tb(['Forma','Total'],Object.entries(pg).map(([k,x])=>[esc(k),brl(x)]))
   +(g?`<h3>Por garçom</h3>`+tb(['Garçom','Total'],Object.entries(gc).map(([k,x])=>[esc(k),brl(x)])):'')
   +`<h3>Itens vendidos</h3>`+tb(['Item','Qtd','Total'],Object.entries(it).map(([k,x])=>[esc(k),x.q,brl(x.t)]))
   +`<h3>Fechamentos individuais</h3>`+v.map(det).join(''):'<p>Sem vendas.</p>');
 };
 const M=S.vendas.filter(v=>v.canal==='mesa'),W=S.vendas.filter(v=>v.canal==='whatsapp');
 let tit,corpo;
 if(tipo==='mesa'){tit='Mesas';corpo=sec('Vendas nas mesas',M,true)}
 else if(tipo==='whatsapp'){tit='WhatsApp';corpo=sec('Vendas por WhatsApp',W,false)}
 else if(tipo==='garcom'){tit=gar?'Garçom '+gar:'Garçons';corpo=(gar?[gar]:gs()).map(g=>`<div class="pg">${sec('Garçom: '+esc(g),M.filter(v=>v.garcom===g),false)}</div>`).join('')||'<p>Sem vendas de garçons neste dia.</p>'}
 else{tit='Geral';corpo=sec('Vendas nas mesas',M,true)+sec('Vendas por WhatsApp',W,false)+`<h2>Total geral: ${brl(S.vendas.reduce((a,v)=>a+v.total,0))}</h2>`}
 const w=window.open('','_blank');
 w.document.write(`<!DOCTYPE html><html lang="pt-BR"><meta charset="UTF-8"><title>Relatório ${esc(tit)} ${dia}</title><style>body{font-family:system-ui,sans-serif;max-width:800px;margin:20px auto;padding:0 14px}table{width:100%;border-collapse:collapse;margin:6px 0 12px}th,td{border-bottom:1px solid #ccc;padding:5px;text-align:left}h2{margin-top:26px;border-bottom:2px solid #000}.cb{display:flex;align-items:center;gap:12px;margin:12px 0}.cb h1{font-size:1.4rem}.bx{border:1px solid #bbb;border-radius:6px;padding:8px 10px;margin:10px 0;break-inside:avoid}.t{text-align:right;font-weight:bold}.pg+.pg{page-break-before:always}@media print{button{display:none}}</style><button onclick="print()">Imprimir / Salvar PDF</button><div class="cb"><img src="${location.origin}/logo.svg" width="56" height="56" alt=""><div><h1>Espetinho da Brasa</h1><div>Relatório de ${esc(tit)} – ${dia.split('-').reverse().join('/')}</div></div></div>${corpo}`);
 w.document.close();
}
</script></body></html>
